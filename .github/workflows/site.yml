# Sync shows from Bandsintown, build, deploy to GitHub Pages, then ping
# IndexNow (PLAN.md section 12).
#
# - Every three hours: sync. Build and deploy only if the shows changed.
# - Nightly: sync, then always rebuild, so shows that have passed roll off.
# - Push to main or a manual run: sync, build and deploy.
#
# Staging (PLAN.md section 14, step 7): set the repository variable
# SITE_NOINDEX to "true". Every page is then noindex and IndexNow stays
# quiet. Delete the variable at cutover.
#
# Sync, build and deploy are jobs in one workflow because commits pushed with
# GITHUB_TOKEN don't trigger other workflows. Until the BANDSINTOWN_APP_ID
# secret exists, the sync step is skipped and the site builds from the
# committed src/data/shows.json (ADR 0006).
#
# Staging lives at new.johnnyrhoades.com (Settings → Pages → custom domain)
# until cutover; docs/runbook-launch.md.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *" # every three hours, off the top of the hour
    - cron: "41 8 * * *" # nightly, 4:41 am in Detroit during daylight time

permissions:
  contents: write # the sync commits src/data/shows.json
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      # Rebuild only when the shows changed, not for the weekly heartbeat commit (that's `changed`).
      changed: ${{ steps.sync.outputs.shows_changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # ships npm 11 (ADR 0004)
          cache: npm

      - run: npm ci

      - name: Sync shows from Bandsintown
        id: sync
        env:
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
        run: |
          if [ -z "$BANDSINTOWN_APP_ID" ]; then
            echo "::warning title=No Bandsintown key::BANDSINTOWN_APP_ID isn't set, so the sync was skipped. The site builds from the committed shows.json."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run sync

      - name: Commit synced data
        id: commit
        if: steps.sync.outputs.changed == 'true'
        env:
          COMMIT_MESSAGE: ${{ steps.sync.outputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/shows.json src/data/sync-meta.json
          git commit -m "$COMMIT_MESSAGE"
          git pull --rebase --quiet
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    # Public service IDs (ADR 0023). The live values are defaults in src/lib/public-config.ts;
    # a repository variable (not a secret: they end up in the page) overrides one if it's set.
    env:
      PUBLIC_FORMSPREE_BOOKING: ${{ vars.PUBLIC_FORMSPREE_BOOKING }}
      PUBLIC_FORMSPREE_SIGNUP: ${{ vars.PUBLIC_FORMSPREE_SIGNUP }}
      PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
      SITE_NOINDEX: ${{ vars.SITE_NOINDEX }}
    outputs:
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    # Three-hourly runs only rebuild when the shows changed; everything else always does.
    if: >-
      github.event_name != 'schedule'
      || github.event.schedule == '41 8 * * *'
      || needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha || github.sha }}

      # Rendered posters, keyed by content hash, so unchanged shows never re-render (ADR 0009).
      - name: Restore the poster cache
        uses: actions/cache@v6
        with:
          path: .cache/posters
          key: posters-${{ hashFiles('src/lib/posters/**', 'src/assets/fonts/poster/**') }}-${{ github.run_id }}
          restore-keys: posters-${{ hashFiles('src/lib/posters/**', 'src/assets/fonts/poster/**') }}-

      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 24

      # Before the deploy, while the old /shows.json is still live: which show pages are new or changed (ADR 0012).
      - name: Plan IndexNow
        id: indexnow
        run: npm run indexnow -- plan

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.indexnow_urls != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tell IndexNow about new and changed show pages
        env:
          INDEXNOW_URLS: ${{ needs.build.outputs.indexnow_urls }}
        run: npm run indexnow -- submit
