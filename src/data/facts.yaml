# The facts ledger (PLAN.md section 6.4). Every biographical claim on the site
# comes from here.
#
# status:
#   verified             an independent source says it (link in `sources`)
#   confirmed_by_johnny  Johnny's own word: his published bio, or him directly
#   unverified           appears nowhere until resolved; `needs` says what would resolve it
#
# Where each status may appear (enforced by `npm run check` and the build):
#   home page:        verified, confirmed_by_johnny
#   press kit:        verified, confirmed_by_johnny (with source links)
#   structured data:  verified only
#
# Text fields, all third person (ADR 0022):
#   third: the claim as a sentence that stands on its own (fast facts, FAQ,
#          short bio, /llms.txt, structured data)
#   bio:   the same claim worded for its place in the running bio, the home page
#          About and the press kit's medium bio (src/lib/bios.ts). It can lean on
#          the sentence before it. Optional; without it the bio uses `third`.
#   *asterisks* mark a title, set in italics
#   detect: for unverified facts, text that must not appear on any built page
#
# Sources for "Johnny's bio": the About text on his Bandzoogle site, captured
# 2026-09-30, and the same bio on Cliff Bell's 2017 event page. "Johnny,
# 2026-10-05" is his written answers to PLAN.md section 17, passed on by Joe.
#
# Notes from Joe (Johnny's cousin, who builds the site) are leads: they go in
# `needs` or a source note, and never change a status on their own.

- id: detroit-guitarist-singer
  third: Johnny Rhoades is a blues guitarist and singer from Detroit, Michigan.
  status: verified
  sources:
    - url: https://cliffbells.com/event/johnny-rhoades-band/
      note: "Cliff Bell's, 2017: Detroit native, guitarist and vocalist"
    - url: http://jbblues.blogspot.com/2010/11/motor-city-josh.html
      note: "2010: guitar and vocals in Motor City Josh & the Big 3"
    - note: Johnny's bio

- id: started-with-motor-city-josh
  third: He joined Motor City Josh’s band in 2006, at 19.
  status: confirmed_by_johnny
  sources:
    - note: Johnny's bio (age 19)
    - note: Johnny, 2026-10-05 (in the band since 2006)
    - url: http://jbblues.blogspot.com/2010/11/motor-city-josh.html
      note: "November 2010 post lists Johnny Rhoades on guitar and vocals in Motor City Josh & the Big 3"

- id: toured-us-europe-mexico-caribbean
  third: He has been on and off the road ever since, around the US and in Europe, Mexico and the Caribbean.
  bio: Since then he’s been on and off the road, around the US and over to Europe, Mexico and the Caribbean.
  status: confirmed_by_johnny
  sources:
    - note: Johnny's bio
    - note: >-
        Johnny, 2026-10-05: Europe (Spain, Norway, Denmark, Scotland) in 2015–16 and Mexico in 2016, both with
        John Németh's band; the Caribbean with Thornetta Davis. Details in nemeth-tours and caribbean-thornetta-davis.

- id: motor-city-josh-albums
  third: "He plays on four Motor City Josh albums, *Covered Up* (2008), *Forty Four: A Tribute to Howlin’ Wolf* (2008), *It’s a Good Life* (2010) and *Finding a New Gear* (2021)."
  bio: "Four of the band’s albums feature him: *Covered Up* and *Forty Four: A Tribute to Howlin’ Wolf* (both 2008), *It’s a Good Life* (2010) and *Finding a New Gear* (2021)."
  status: confirmed_by_johnny
  sources:
    - note: Johnny, 2026-10-05 (the four albums he's on)
    - url: https://music.apple.com/us/artist/motor-city-josh/60645004
      note: Apple Music lists Covered Up and Forty Four (both 2008) and It's a Good Life (2010). No musician credits.
    - url: https://motorcityjosh.hearnow.com/
      note: The band's release page for Finding a New Gear says 2021 (July 21). Discogs says 2020; the band's own page wins.

