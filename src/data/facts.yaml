- id: motor-city-josh-detroit-music-awards
  third: He won Detroit Music Awards for Outstanding Blues Artist/Group in 2020 and 2023 with Motor City Josh & The Big 3, where he still plays guitar.
  first: I won Detroit Music Awards in 2020 and 2023 with Motor City Josh & The Big 3, and I still play guitar in the band.
  status: verified
  tags: [highlight]
  sources:
    - url: https://www.detroitmusicawards.net/2023-winners
      note: "2023 winner, Outstanding Blues Artist/Group: Motor City Josh & The Big 3"
    - url: https://wrif.com/2020/04/20/see-the-full-list-of-detroit-music-awards-2020-winners/
      note: "2020 winner, Outstanding Blues Artist/Group and Outstanding Live Performance: Motor City Josh & The Big 3"
    - url: https://tallahasseearts.org/event/motor-city-josh-the-big-3/
      note: The award lists name the band, not its members. This January 2023 show listing names "longtime guitarist Johnny Rhoades".
    - url: https://www.youtube.com/watch?v=Xvm2uMDesXU
      note: With the band on Live in the D in January 2020, three months before the 2020 awards
    - note: Joe, 2026-10-02, says Johnny still plays in the band. His bio's "Detroit Music Award nominee" (2017) may be an earlier nomination; the wins supersede it on the site.

