- id: nemeth-feelin-freaky
  third: He was the guitarist in John Németh’s band, the Blue Dreamers, and plays on Németh’s 2017 album *Feelin’ Freaky*, produced by Luther Dickinson.
  first: I was John Németh’s guitar player in the Blue Dreamers, and I’m on his 2017 album *Feelin’ Freaky*, produced by Luther Dickinson.
  status: verified
  tags: [highlight]
  sources:
    - url: https://www.bluesblastmagazine.com/john-nemeth-feelin-freaky-album-review/
      note: "Blues Blast review, May 2017: the personnel lists Johnny Rhoades on guitar"
    - url: https://www.americanbluesscene.com/2017/05/john-nemeth-feelin-freaky-new-release/
      note: Released May 19, 2017 on Németh's Memphis Grease label, produced by Luther Dickinson at Zebra Ranch, Coldwater, Mississippi. Names Johnny in the Blue Dreamers and says he had since left the band.
    - url: http://www.elmoremagazine.com/2017/04/premieres/john-nemeth-and-the-blue-dreamers-are-feelin-freaky-and-funky-in-their-new-video
      note: Spells him "Johnny Rhodes". Recorded at Zebra Ranch and at Royal Studios in Memphis.

