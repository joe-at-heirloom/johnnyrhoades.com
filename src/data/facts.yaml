# The facts ledger (PLAN.md section 6.4). Every biographical claim on the site
# comes from here.
#
# status:
#   verified             an independent source says it (link in `sources`)
#   confirmed_by_johnny  Johnny's own word: his published bio, or him directly
#   unverified           appears nowhere until resolved; `needs` says what would resolve it
#
# Where each status may appear (enforced by `npm run check` and the build):
#   home page (Johnny's voice):  verified, confirmed_by_johnny
#   press kit:                   verified, confirmed_by_johnny (with source links)
#   structured data:             verified only
#
# Text fields:
#   third: third person, for the press kit and bios
#   first: Johnny's voice, for the home page (optional)
#   *asterisks* mark a title, set in italics
#   detect: for unverified facts, text that must not appear on any built page
#
# Sources for "Johnny's bio": the About text on his Bandzoogle site, captured
# 2026-09-30, and the same bio on Cliff Bell's 2017 event page.
#
# Notes from Joe (Johnny's cousin, who builds the site) are leads: they go in
# `needs` or a source note, and never change a status on their own.

- id: detroit-guitarist-singer
  third: Johnny Rhoades is a blues guitarist and singer from Detroit, Michigan.
  first: I’m a guitar player and singer from Detroit.
  status: verified
  sources:
    - url: https://cliffbells.com/event/johnny-rhoades-band/
      note: "Cliff Bell's, 2017: Detroit native, guitarist and vocalist"
    - url: http://jbblues.blogspot.com/2010/11/motor-city-josh.html
      note: "2010: guitar and vocals in Motor City Josh & the Big 3"
    - note: Johnny's bio

