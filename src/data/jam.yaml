    sha256: c6c5d0fe11a394e94be3146a950c3377ec102cb57d189d5a23cec26183d1963a
    root: .
  swirly:
    name: Swirly Drums v1.104
    by: Karoryfer Samples
    license: CC0 1.0
    url: https://github.com/sfzinstruments/karoryfer.swirly-drums/releases/download/v1.104/Swirly.Drums_1104.zip
    sha256: dbeb1ad04052da1bada490ced8cc7d9fdd3b21ea90f7c6020269968b70f836c3
    root: .
  meatbass:
    name: Meatbass v1.001
    by: Karoryfer Samples
    license: CC0 1.0
    url: https://github.com/sfzinstruments/karoryfer.meatbass/releases/download/v1.001/Karoryfer.Meatbass.v1.001.zip
    sha256: bc053061d4f39fb76ba56bc1f323efa228d1f63757c331738812479bcf04fe96
    root: Meatbass
  growlybass:
    name: Growlybass v1.002
    by: Karoryfer Samples
    license: CC0 1.0
    url: https://github.com/sfzinstruments/karoryfer.growlybass/releases/download/v1.002/Karoryfer.Growlybass.v1.002.zip
    sha256: b92dca75494fa39d6e8d8b8addaabfe70c5aaa59b5f9a0f624be6de51a2374bc
    root: Growlybass
  shinyguitar:
    name: Shinyguitar v1.002
    by: Karoryfer Samples
    license: CC0 1.0
    url: https://github.com/sfzinstruments/karoryfer.shinyguitar/releases/download/v1.002/Karoryfer.Shinyguitar.v1.002.zip
    sha256: 23cf4030cbf9ce9e2c84d7cbb1c022fbca124bfff0ad118a14eda7cf6c921d7b
    root: Shinyguitar
  salamander:
    name: Salamander Grand Piano V3 (SFZ by kinwie)
    by: Alexander Holm
    license: CC BY 3.0
    url: https://github.com/sfzinstruments/SalamanderGrandPiano/archive/refs/heads/master.zip
    sha256: 74d11c1ea0fcfe77eb80d6a48e960cbfc42716bdfd74a621eca5799f1680cb5c
    root: SalamanderGrandPiano-master
  mtgsax:
    name: MTG Solo Sax (SFZ by kinwie)
    by: Music Technology Group, Universitat Pompeu Fabra
    license: CC BY 4.0
    url: https://github.com/sfzinstruments/MTG.SoloSax/archive/refs/heads/master.zip
    sha256: 7f9dda479efb6c137c30617e804153e6b0c4ec1964fd95811c1d3321373b03b1
    root: MTG.SoloSax-master

# Pitched tones: each note held this many seconds, then let go.
tones:
  # Meatbass: a 1958 Otto Rubner double bass, plucked. Four loudness layers and four takes in the library.
  - { part: bass, tone: upright, name: Meatbass pizzicato, from: meatbass, sfz: Programs/04_pizz.sfz, layers: [50, 85, 115], takes: 2, seconds: 1.4 }
  # Growlybass: a Squier Jazz Bass, recorded direct. Mapped an octave above where it sounds.
  - { part: bass, tone: electric, name: Growlybass, from: growlybass, sfz: growlybass_clean.sfz, transpose: 12, layers: [55, 90, 118], takes: 2, seconds: 1.4 }
  # Shinyguitar: an archtop. Its pickup, clean (and through our crunch amp), and its microphone for the acoustic sound.
  - { part: guitar, tone: crunch, name: Shinyguitar pickup through a crunch amp, from: shinyguitar, sfz: Programs/main.sfz, cc: { '100': 0, '106': 0, '107': 0 }, amp: crunch, layers: [60, 105], takes: 2, seconds: 2 }
  - { part: guitar, tone: clean, name: Shinyguitar pickup, from: shinyguitar, sfz: Programs/main.sfz, cc: { '100': 0, '106': 0, '107': 0 }, layers: [55, 100], takes: 2, seconds: 2 }
  - { part: guitar, tone: acoustic, name: Shinyguitar microphone, from: shinyguitar, sfz: Programs/main.sfz, cc: { '100': 127, '106': 0, '107': 0 }, layers: [55, 100], takes: 2, seconds: 2 }
  # Salamander: a Yamaha C5 grand, 16 loudness layers in the library.
  - { part: keys, tone: piano, name: Salamander Grand Piano, from: salamander, sfz: Salamander Grand Piano V3.sfz, layers: [45, 80, 112], seconds: 2.4 }
  # No freely licensed drawbar organ or blues harmonica beats the soundfont's.
  - { part: keys, tone: organ, name: Drawbar Organ, from: soundfont, preset: 16, layers: [100], octaves: any, seconds: 3 }
  - { part: lead, tone: harp, name: Harmonica, from: soundfont, preset: 22, layers: [105], seconds: 2 }
  # MTG tenor sax: a sample every semitone, soft and loud. The non-looped program, since a browser ignores loop points.
  - { part: lead, tone: sax, name: MTG Tenor Sax, from: mtgsax, sfz: MTG Solo Saxophones/MTG Tenor Sax (NL).sfz, layers: [85, 115], seconds: 2 }

# Drum hits: each kit's pieces, by MIDI key in the library's program.
drums:
  # Virtuosity: a jazz kit played with sticks, close mics and overheads. The basic program; the cross-stick is only in the full one.
  - { tone: sticks, piece: kick, from: virtuosity, sfz: Programs/01-basic-kit.sfz, key: 36, layers: [55, 90, 120], takes: 3 }
  - { tone: sticks, piece: snare, from: virtuosity, sfz: Programs/01-basic-kit.sfz, key: 38, layers: [45, 80, 115], takes: 3 }
  - { tone: sticks, piece: hat, from: virtuosity, sfz: Programs/01-basic-kit.sfz, key: 42, layers: [45, 80, 110], takes: 4 }
  - { tone: sticks, piece: ride, from: virtuosity, sfz: Programs/01-basic-kit.sfz, key: 51, layers: [55, 90, 115], takes: 3 }
  - { tone: sticks, piece: crash, from: virtuosity, sfz: Programs/01-basic-kit.sfz, key: 49, layers: [85, 115], takes: 2 }
  - { tone: sticks, piece: rim, from: virtuosity, sfz: Programs/02-full-kit.sfz, cc: { '4': 127 }, key: 88, layers: [70, 105], takes: 2 }
  # Swirly: a kit played with brushes throughout. It has no cross-stick, so a soft hit on the snare's edge stands in.
  - { tone: brushes, piece: kick, from: swirly, sfz: Programs/Basic_kit.sfz, key: 36, layers: [50, 85, 115], takes: 3 }
  - { tone: brushes, piece: snare, from: swirly, sfz: Programs/Basic_kit.sfz, key: 38, layers: [45, 80, 110], takes: 3 }
  - { tone: brushes, piece: hat, from: swirly, sfz: Programs/Basic_kit.sfz, key: 42, layers: [40, 75, 105], takes: 4 }
  - { tone: brushes, piece: ride, from: swirly, sfz: Programs/Basic_kit.sfz, key: 51, layers: [50, 85, 110], takes: 3 }
  - { tone: brushes, piece: crash, from: swirly, sfz: Programs/Basic_kit.sfz, key: 49, layers: [80, 110], takes: 2 }
  - { tone: brushes, piece: rim, from: swirly, sfz: Programs/Basic_kit.sfz, key: 40, layers: [55, 90], takes: 2 }

# Generated with ElevenLabs (needs ELEVENLABS_API_KEY to regenerate; spends credits).
generated:
  - { id: room-bar, part: room, tone: bar, seconds: 20, loop: true, prompt: "Ambience of a small neighborhood bar on a weeknight, quiet murmur of conversation, glasses clinking, no music" }
  - { id: room-vinyl, part: room, tone: vinyl, seconds: 12, loop: true, prompt: "Vinyl record surface noise, soft crackle and hiss of an old 78, no music" }
