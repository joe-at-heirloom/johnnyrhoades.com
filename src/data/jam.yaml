# The sounds the blues maker plays (/jam/, ADRs 0030 and 0031).
#
# `npm run jam:sounds` builds them all into src/assets/jam/ and
# src/data/jam-sounds.json:
#
# - The instruments and drums are real recorded samples from the MuseScore
#   General soundfont (MIT; FluidR3Mono, and the public-domain Splendid Grand
#   piano), rendered note by note with FluidSynth, dry (no reverb or chorus).
#   Each pitched tone gets a sample every SAMPLE_STEP semitones across what its
#   part plays (sampleNotes in src/lib/jam.ts), at its true pitch. The
#   soundfont isn't committed: download it to .cache/soundfont/ (url below);
#   the script checks its sha256.
# - The two room loops were generated once with ElevenLabs' sound-effects
#   model; their originals are in src/assets/jam-source/.
#
# Presets are General MIDI program numbers, counted from 0. Drum kits are on
# channel 10: Jazz is program 32, Brush is 40.

soundfont:
  file: MuseScore_General.sf3
  url: https://ftp.osuosl.org/pub/musescore/soundfont/MuseScore_General/MuseScore_General.sf3
  sha256: 5b85b6c2c61d10b2b91cddd41efcce7b25cd31c8271d511c73afafbef20b6fa3

# Pitched tones: held this many seconds, at this velocity, then let go.
tones:
  - { part: bass, tone: upright, preset: 32, name: Acoustic Bass, velocity: 105, seconds: 1.4 }
  - { part: bass, tone: electric, preset: 33, name: Fingered Bass, velocity: 100, seconds: 1.4 }
  - { part: guitar, tone: crunch, preset: 29, name: Overdrive Guitar, velocity: 100, seconds: 2 }
  - { part: guitar, tone: clean, preset: 26, name: Jazz Guitar, velocity: 100, seconds: 2 }
  - { part: guitar, tone: acoustic, preset: 25, name: Steel String Guitar, velocity: 100, seconds: 2 }
  - { part: keys, tone: piano, preset: 0, name: Grand Piano, velocity: 95, seconds: 2.4 }
  - { part: keys, tone: organ, preset: 16, name: Drawbar Organ, velocity: 100, seconds: 3 }
  - { part: lead, tone: harp, preset: 22, name: Harmonica, velocity: 105, seconds: 2 }
  - { part: lead, tone: sax, preset: 66, name: Tenor Sax, velocity: 100, seconds: 2 }

# Drum hits: one per piece per kit. GM drum notes: 36 kick, 37 side stick,
# 38 snare (brush tap on the Brush kit), 39 brush slap, 40 brush swirl,
# 42 closed hi-hat, 49 crash, 51 ride.
drums:
  - { id: sticks-kick, tone: sticks, kit: 32, key: 36, velocity: 110 }
  - { id: sticks-snare, tone: sticks, kit: 32, key: 38, velocity: 105 }
  - { id: sticks-hat, tone: sticks, kit: 32, key: 42, velocity: 95 }
  - { id: sticks-ride, tone: sticks, kit: 32, key: 51, velocity: 95 }
  - { id: sticks-crash, tone: sticks, kit: 32, key: 49, velocity: 100 }
  - { id: sticks-rim, tone: sticks, kit: 32, key: 37, velocity: 100 }
  - { id: brushes-kick, tone: brushes, kit: 40, key: 36, velocity: 100 }
  - { id: brushes-snare, tone: brushes, kit: 40, key: 39, velocity: 105 }
  - { id: brushes-sweep, tone: brushes, kit: 40, key: 40, velocity: 100 }
  - { id: brushes-ride, tone: brushes, kit: 40, key: 51, velocity: 90 }
  - { id: brushes-crash, tone: brushes, kit: 40, key: 49, velocity: 90 }
  - { id: brushes-rim, tone: brushes, kit: 40, key: 37, velocity: 95 }

# Generated with ElevenLabs (needs ELEVENLABS_API_KEY to regenerate; spends credits).
generated:
  - { id: room-bar, part: room, tone: bar, seconds: 20, loop: true, prompt: "Ambience of a small neighborhood bar on a weeknight, quiet murmur of conversation, glasses clinking, no music" }
  - { id: room-vinyl, part: room, tone: vinyl, seconds: 12, loop: true, prompt: "Vinyl record surface noise, soft crackle and hiss of an old 78, no music" }
