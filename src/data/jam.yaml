# The sounds the blues maker plays (/jam/, ADRs 0030, 0031 and 0032).
#
# `npm run jam:sounds` builds them all into src/assets/jam/ and
# src/data/jam-sounds.json:
#
# - Instruments and drum kits are rendered from real recordings: deeply
#   sampled instrument libraries (rendered with sfizz) where a free one does
#   the part best, and the MuseScore General soundfont (with FluidSynth) for
#   the rest. Each is recorded dry at one or more loudness layers (`layers`:
#   the velocities played) and in `takes` (repeats, slightly varied, so the
#   library's own round robins and layers come through and repeated notes
#   differ). Pitched tones get a note every SAMPLE_STEP semitones across what
#   their part plays (sampleNotes in src/lib/jam.ts), and every note is
#   checked for pitch and octave. None of the sources are committed: they're
#   downloaded to .cache/ from the URLs here, and the script checks each
#   one's sha256.
# - The two room loops were generated once with ElevenLabs; their originals
#   are in src/assets/jam-source/.

soundfont:
  file: MuseScore_General.sf3
  url: https://ftp.osuosl.org/pub/musescore/soundfont/MuseScore_General/MuseScore_General.sf3
  sha256: 5b85b6c2c61d10b2b91cddd41efcce7b25cd31c8271d511c73afafbef20b6fa3

# Downloaded into .cache/libraries/<id>/archive.zip and unpacked beside it.
